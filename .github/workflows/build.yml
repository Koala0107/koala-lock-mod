name: Build korime_scene

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Build
        working-directory: korime_scene
        run: gradle clean build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: korime-scene-${{ github.sha }}
          path: korime_scene/build/libs/korime-scene-*.jar
          if-no-files-found: error
