name: Build korime_scene

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Normalize korime_scene source tree
        if: github.ref_name == 'refactor/korime-scene-clean-1.5.0' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json, shutil

          root = Path('korime_scene')

          # Java package + legacy class names.
          old_java = root / 'src/main/java/kr/koala/crouchlock'
          new_java = root / 'src/main/java/kr/koala/korime_scene'
          if old_java.exists():
              new_java.mkdir(parents=True, exist_ok=True)
              for src in old_java.glob('*.java'):
                  name = src.name.replace('CrouchLockMod', 'KorimeSceneMod').replace('CrouchLockClient', 'KorimeSceneClient')
                  shutil.move(str(src), str(new_java / name))
              shutil.rmtree(old_java)

          text_suffixes = {'.java', '.json', '.gradle', '.properties', '.md', '.yml', '.yaml', '.txt'}
          replacements = [
              ('kr.koala.crouchlock', 'kr.koala.korime_scene'),
              ('CrouchLockMod', 'KorimeSceneMod'),
              ('CrouchLockClient', 'KorimeSceneClient'),
              ('screen.crouchlock.', 'screen.korime_scene.'),
              ('message.crouchlock.', 'message.korime_scene.'),
              ('item.crouchlock.', 'item.korime_scene.'),
              ('block.crouchlock.', 'block.korime_scene.'),
              ('command.crouchlock.', 'command.korime_scene.'),
              ('crouchlock:', 'korime_scene:'),
              ('CrouchLockKeyId', 'KorimeSceneKeyId'),
              ('CrouchLockLockId', 'KorimeSceneLockId'),
          ]
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              changed = text
              for old, new in replacements:
                  changed = changed.replace(old, new)
              if changed != text:
                  path.write_text(changed, encoding='utf-8')

          # Legacy duplicate asset namespace is fully mirrored under korime_scene.
          legacy_assets = root / 'src/main/resources/assets/crouchlock'
          if legacy_assets.exists():
              shutil.rmtree(legacy_assets)

          java_dir = root / 'src/main/java/kr/koala/korime_scene'

          # Registry IDs requested for command use.
          mod = java_dir / 'KorimeSceneMod.java'
          if mod.exists():
              t = mod.read_text(encoding='utf-8')
              t = t.replace('new Identifier(MOD_ID, "lock_key")', 'new Identifier(MOD_ID, "key")')
              mod.write_text(t, encoding='utf-8')

          tools = java_dir / 'SceneToolsMod.java'
          if tools.exists():
              t = tools.read_text(encoding='utf-8').replace('new Identifier(CrouchLockMod.MOD_ID, "evidence_magnifier")', 'new Identifier(KorimeSceneMod.MOD_ID, "evidence")')
              t = t.replace('new Identifier(KorimeSceneMod.MOD_ID, "evidence_magnifier")', 'new Identifier(KorimeSceneMod.MOD_ID, "evidence")')
              tools.write_text(t, encoding='utf-8')

          lines = java_dir / 'BoundaryLineMod.java'
          if lines.exists():
              t = lines.read_text(encoding='utf-8')
              t = t.replace('"boundary_line_horizontal"', '"line_horizontal"')
              t = t.replace('"boundary_line_vertical"', '"line_vertical"')
              t = t.replace('"boundary_line_corner"', '"line_corner"')
              lines.write_text(t, encoding='utf-8')

          # Evidence outline follows the half-size visible model.
          evidence_block = java_dir / 'EvidenceMagnifierBlock.java'
          if evidence_block.exists():
              t = evidence_block.read_text(encoding='utf-8')
              t = t.replace('Block.createCuboidShape(0, 0, 7.25, 16, 16, 8.75)', 'Block.createCuboidShape(4, 4, 7.25, 12, 12, 8.75)')
              t = t.replace('Block.createCuboidShape(7.25, 0, 0, 8.75, 16, 16)', 'Block.createCuboidShape(7.25, 4, 4, 8.75, 12, 12)')
              evidence_block.write_text(t, encoding='utf-8')

          res = root / 'src/main/resources'

          def rename(rel_old, rel_new):
              old = res / rel_old
              new = res / rel_new
              if old.exists():
                  new.parent.mkdir(parents=True, exist_ok=True)
                  if new.exists():
                      new.unlink()
                  old.rename(new)

          rename('assets/korime_scene/models/item/lock_key.json', 'assets/korime_scene/models/item/key.json')
          rename('data/korime_scene/recipes/lock_key.json', 'data/korime_scene/recipes/key.json')
          rename('data/korime_scene/advancements/recipes/tools/lock_key.json', 'data/korime_scene/advancements/recipes/tools/key.json')

          rename('assets/korime_scene/blockstates/evidence_magnifier.json', 'assets/korime_scene/blockstates/evidence.json')
          rename('assets/korime_scene/models/item/evidence_magnifier.json', 'assets/korime_scene/models/item/evidence.json')
          rename('assets/korime_scene/models/block/evidence_magnifier.json', 'assets/korime_scene/models/block/evidence.json')
          rename('data/korime_scene/loot_tables/blocks/evidence_magnifier.json', 'data/korime_scene/loot_tables/blocks/evidence.json')

          for old, new in [
              ('boundary_line_horizontal', 'line_horizontal'),
              ('boundary_line_vertical', 'line_vertical'),
              ('boundary_line_corner', 'line_corner'),
          ]:
              rename(f'assets/korime_scene/blockstates/{old}.json', f'assets/korime_scene/blockstates/{new}.json')
              rename(f'assets/korime_scene/models/item/{old}.json', f'assets/korime_scene/models/item/{new}.json')
              rename(f'assets/korime_scene/models/block/{old}.json', f'assets/korime_scene/models/block/{new}.json')
              rename(f'data/korime_scene/loot_tables/blocks/{old}.json', f'data/korime_scene/loot_tables/blocks/{new}.json')

          # Resource references after file renames.
          resource_replacements = [
              ('korime_scene:block/evidence_magnifier', 'korime_scene:block/evidence'),
              ('korime_scene:block/boundary_line_horizontal', 'korime_scene:block/line_horizontal'),
              ('korime_scene:block/boundary_line_vertical', 'korime_scene:block/line_vertical'),
              ('korime_scene:block/boundary_line_corner', 'korime_scene:block/line_corner'),
          ]
          for path in res.rglob('*.json'):
              text = path.read_text(encoding='utf-8')
              changed = text
              for old, new in resource_replacements:
                  changed = changed.replace(old, new)
              if changed != text:
                  path.write_text(changed, encoding='utf-8')

          # Keep item textures, but point new IDs to them.
          key_model = res / 'assets/korime_scene/models/item/key.json'
          if key_model.exists():
              data = json.loads(key_model.read_text(encoding='utf-8'))
              data.setdefault('textures', {})['layer0'] = 'korime_scene:item/lock_key'
              key_model.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')

          evidence_model = res / 'assets/korime_scene/models/block/evidence.json'
          if evidence_model.exists():
              data = json.loads(evidence_model.read_text(encoding='utf-8'))
              data['elements'] = [{
                  'from': [4, 4, 7.99], 'to': [12, 12, 8.01],
                  'faces': {
                      'north': {'uv': [0,0,16,16], 'texture': '#evidence'},
                      'south': {'uv': [16,0,0,16], 'texture': '#evidence'}
                  }
              }]
              evidence_model.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')

          # Recipe / advancement use the new key registry ID.
          recipe = res / 'data/korime_scene/recipes/key.json'
          if recipe.exists():
              data = json.loads(recipe.read_text(encoding='utf-8'))
              data['result']['item'] = 'korime_scene:key'
              recipe.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
          advancement = res / 'data/korime_scene/advancements/recipes/tools/key.json'
          if advancement.exists():
              data = json.loads(advancement.read_text(encoding='utf-8'))
              data['rewards']['recipes'] = ['korime_scene:key']
              advancement.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')

          evidence_loot = res / 'data/korime_scene/loot_tables/blocks/evidence.json'
          if evidence_loot.exists():
              text = evidence_loot.read_text(encoding='utf-8').replace('korime_scene:evidence_magnifier', 'korime_scene:evidence')
              evidence_loot.write_text(text, encoding='utf-8')

          for name in ('line_horizontal', 'line_vertical', 'line_corner'):
              loot = res / f'data/korime_scene/loot_tables/blocks/{name}.json'
              if loot.exists():
                  text = loot.read_text(encoding='utf-8')
                  text = text.replace('korime_scene:boundary_line_horizontal', 'korime_scene:line_horizontal')
                  text = text.replace('korime_scene:boundary_line_vertical', 'korime_scene:line_vertical')
                  text = text.replace('korime_scene:boundary_line_corner', 'korime_scene:line_corner')
                  loot.write_text(text, encoding='utf-8')

          # Language keys follow the registry names.
          for lang in ('ko_kr.json', 'en_us.json'):
              path = res / 'assets/korime_scene/lang' / lang
              if not path.exists():
                  continue
              data = json.loads(path.read_text(encoding='utf-8'))
              if 'item.korime_scene.lock_key' in data:
                  data['item.korime_scene.key'] = data.pop('item.korime_scene.lock_key')
              if 'item.korime_scene.evidence_magnifier' in data:
                  data['item.korime_scene.evidence'] = data.pop('item.korime_scene.evidence_magnifier')
              if 'block.korime_scene.evidence_magnifier' in data:
                  data['block.korime_scene.evidence'] = data.pop('block.korime_scene.evidence_magnifier')
              if lang == 'ko_kr.json':
                  data['item.korime_scene.evidence'] = '증거'
                  data['block.korime_scene.evidence'] = '증거'
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')

          # Marker file makes this one-off source migration explicit.
          (root / '.namespace-cleaned').write_text('korime_scene 1.5.0\n', encoding='utf-8')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Build
        working-directory: korime_scene
        run: gradle clean build --stacktrace

      - name: Commit normalized source
        if: github.ref_name == 'refactor/korime-scene-clean-1.5.0' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Normalize internal namespace to korime_scene"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: korime-scene-${{ github.sha }}
          path: korime_scene/build/libs/korime-scene-*.jar
          if-no-files-found: error
